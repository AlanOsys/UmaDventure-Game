<body>

<script>

function Initialise(){
    stats = [60,60,60,60]
    statNames = ['Str','Spd','Cap','Int']
    statGains = [5,5,5,5]
    document.getElementById("Turn").innerHTML = 'Turn 1'
    
    Training()
    assignTrainingAndRest()
}
function Begin_Game(){
    /*container = document.getElementById("container")
    gamedisplay = document.createElement("div")
    gamedisplay.id = 'gamedisplay'
    container.appendChild(gamedisplay)
    randomSeed = []
    for(let i = 0;i<10;i++){
        randomSeed.push(Math.floor(Math.random()*2))
    }*/
    
    //distances = [400,800,1200]
    //distance = distances[Math.floor(Math.random()*distances.length)]
    //gamedisplay.innerHTML = distance
    //placeholderRacer = [3,3,3,3]
    Initialise()
}
function assignTrainingAndRest(){
    EnergyFillMissing = document.getElementById("EnergyFillMissing")
    EnergyFillMissing.value =  parseInt(Math.random()*10)
    EnergyFill = document.getElementById("EnergyFill")
    EnergyFill.value = parseInt(Math.random()*20)
    statNodes = document.getElementsByClassName("statNode")
    for(let i = 0;i<statNodes.length;i++){
        statNodes[i].value = parseInt(Math.random() * 5)
    }
    TurnCount = document.getElementById("Turn")
    TurnCount.innerHTML = 'Turn ' + (parseInt(TurnCount.innerHTML.split(" ")[1])+1)
}
function Training(){
    TrainContainer = document.getElementById("TrainContainer")
    StatContainer = document.getElementById("StatContainer")
    while(StatContainer.children.length > 0){
        StatContainer.removeChild(StatContainer.lastChild);
    }
    while(StatNameContainer.children.length > 0){
        StatNameContainer.removeChild(StatNameContainer.lastChild);
    }

    for(let i = 0; i < stats.length; i++){
        statNode = document.createElement("button")
        statNode.className = 'statNode'
        statNode.innerHTML = String(stats[i])
        //statNode.value = statGains[i]
        statNode.dataset.index = i
        statNode.style.position = 'relative'

        statNode.onmouseover = function() {
            const tooltipId = 'trainValueNode_' + this.dataset.index
            if(document.getElementById(tooltipId)){
                document.getElementById(tooltipId).remove()
            }
            const rect = this.getBoundingClientRect()
            const containerRect = StatContainer.getBoundingClientRect()

            trainValueNode = document.createElement("div")
            trainValueNode.id = tooltipId
            trainValueNode.innerHTML = '+' + this.value
            trainValueNode.style.cssText = `
                position: absolute;
                left: ${rect.left - containerRect.left + rect.width / 2}px;
                top: ${rect.top - containerRect.top - rect.height * 0.7}px;
                transform: translateX(-50%);
                background: rgba(225,70,0,0.8);
                color: white;
                padding: 3px 7px;
                border-radius: 30px;
                font-size: 30px;
                white-space: nowrap;
                pointer-events: none;
                width: 60px;
                height: 65px;
          
                text-align: center;
                z-index: 1;
            `
            EnergyFill = document.getElementById("EnergyFill")
            
            EnergyFillMissing = document.getElementById("EnergyFillMissing")
            EnergyFill.style.width = (parseInt(EnergyFill.style.width) - EnergyFillMissing.value-this.value)+'%'
            
            StatContainer.appendChild(trainValueNode)
        }

        statNode.onmouseleave = function() {
            const tooltipId = 'trainValueNode_' + this.dataset.index
            if(document.getElementById(tooltipId)){
                document.getElementById(tooltipId).remove()
            }
            EnergyFill = document.getElementById("EnergyFill")
            EnergyFillMissing = document.getElementById("EnergyFillMissing")
            EnergyFill.style.width = EnergyFillMissing.style.width
        }

        statNode.onclick = function() {
            stat = parseInt(this.innerHTML)
            EnergyFillMissing = document.getElementById("EnergyFillMissing")
            EnergyFill = document.getElementById("EnergyFill")
            if(parseInt(EnergyFill.style.width) > parseInt(EnergyFillMissing.value)){
                stat += parseInt(this.value)
                this.innerHTML = String(stat)
                EnergyFill = document.getElementById("EnergyFill")
                EnergyFillMissing = document.getElementById("EnergyFillMissing")
                EnergyFillMissing.style.width = EnergyFill.style.width
                assignTrainingAndRest()
                
                this.onmouseleave()
                this.onmouseover()

            }
            
            
            
        }

        StatContainer.appendChild(statNode)
        statNameNode = document.createElement("div")
        statNameNode.className = 'statNameNode'
        statNameNode.innerHTML = String(statNames[i])
        StatNameContainer.appendChild(statNameNode)
    }
    Rest = document.getElementById("Rest")
    Rest.onclick = function Rest(){
        EnergyFill = document.getElementById("EnergyFill")
        EnergyFillMissing = document.getElementById("EnergyFillMissing")
        EnergyFillMissing.style.width = EnergyFill.style.width
        assignTrainingAndRest()
        this.onmouseleave()
        this.onmouseover()
        
        
    }
    Rest.onmouseover = function RestHover(){
        EnergyFill = document.getElementById("EnergyFill")
        EnergyFill.style.width = (parseInt(EnergyFill.style.width) + parseInt(EnergyFill.value))+'%'
        EnergyFillMissing = document.getElementById("EnergyFillMissing")
        EnergyFillMissing.style.zIndex = 1
        EnergyFill.style.zIndex = 0

    }
    Rest.onmouseleave = function RestLeave(){
        EnergyFill = document.getElementById("EnergyFill")
        EnergyFillMissing = document.getElementById("EnergyFillMissing")
        EnergyFill.style.width = EnergyFillMissing.style.width
        EnergyFillMissing.style.zIndex = 0
        EnergyFill.style.zIndex = 1
    }
}
function DungeonOpen(){
    PossibleDungeons = ['Deep Cavern','Skeleton Tomb','Spider Nest']
    PossibleResources = ['Bread','Coal','Gold']
    if(document.getElementById("DungeonContainer")){
        document.getElementById("DungeonContainer").remove()
    }
    DungeonContainer = document.createElement("div")
    DungeonContainer.id = 'DungeonContainer'
    backButton = document.createElement('button')
    backButton.id = 'backButton'
    backButton.innerHTML = '<- Back'
    backButton.onclick = function backFunc(){
        this.parentNode.remove()
    }
    DungeonContainer.appendChild(backButton)
    DungeonsContainer = document.createElement("div")
    DungeonsContainer.id = 'DungeonsContainer'
    
    DungeonContainer.appendChild(DungeonsContainer)
    DungeonView = document.createElement("div")
    DungeonView.id = 'DungeonView'
    DungeonContainer.appendChild(DungeonView)
    currentclicked = ''
    for(let i = 0;i<5;i++){
        DungeonCall = document.createElement("div")
        DungeonCall.className = 'DungeonCall'

        DungeonCallName = document.createElement("p")
        DungeonCallName.innerHTML = PossibleDungeons[Math.floor(Math.random() * PossibleDungeons.length)]
        DungeonCallResources = document.createElement("p")
        DungeonCallResources.innerHTML = PossibleResources[Math.floor(Math.random() * PossibleResources.length)]
        DungeonCallDanger = document.createElement("p")
        DungeonCallDanger.innerHTML = Math.floor(Math.random()*3)+1
        DungeonCall.appendChild(DungeonCallName)
        DungeonCall.appendChild(DungeonCallResources)
        DungeonCall.appendChild(DungeonCallDanger)

        DungeonCall.onclick = function DungeonCallCheck() {
            if (currentclicked != '') {
                // Reset the previously selected card
                currentclicked.style.backgroundColor = '';
                currentclicked.onclick = arguments.callee; // restore DungeonCallCheck
            }

            DungeonView = document.getElementById('DungeonView');
            DungeonView.innerHTML = this.children[0].innerHTML + ',' + this.children[1].innerHTML + ',' + this.children[2].innerHTML;
            this.style.backgroundColor = 'blue';

            currentclicked = this;

            this.onclick = function DungeonDoubleClick() {
                backButton.onclick();
                DungeonViewContainer = document.createElement("div")
                DungeonViewContainer.id = "container"
                document.body.appendChild(DungeonViewContainer)
                TasksDisplay = document.createElement("div")
                TasksDisplay.className = "TasksDisplay"
                NextTaskButton = document.createElement("button")
                NextTaskButton.className = 'NextTaskButton'
                NextTaskButton.innerHTML = 'Next'
                NextTaskButton.onclick = function NextTaskButtonClick(){
                    if(TasksDisplay.children.length < 3){
                        Task = document.createElement("div")
                        Task.className = 'Tasks'
                        TasksDisplay.appendChild(Task)
                    }if(TasksDisplay.children.length == 1){
                        Task.style.backgroundColor = "rgb(105, 80, 43)"
                    }if(TasksDisplay.children.length == 2){
                        Task.style.backgroundColor = "rgb(70,100,130)"
                    }if(TasksDisplay.children.length == 3){
                        Task.style.backgroundColor = "rgb(42,42,42)"
                    }
                    
                }
                DungeonViewContainer.appendChild(NextTaskButton)
                DungeonViewContainer.appendChild(TasksDisplay)
            };
        }
        DungeonsContainer.appendChild(DungeonCall)
    }
    document.body.appendChild(DungeonContainer)
}
Begin_Game()

</script>
